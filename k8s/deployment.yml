apiVersion: apps/v1
kind: Deployment
metadata:
  name: placetrack
  namespace: default
  labels:
    app: placetrack
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placetrack
  template:
    metadata:
      labels:
        app: placetrack
    spec:
      containers:
        - name: placetrack
          image: guptaarpitggc-eng/placetrack:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
