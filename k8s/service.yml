apiVersion: v1
kind: Service
metadata:
  name: placetrack
  namespace: default
  labels:
    app: placetrack
spec:
  type: ClusterIP
  selector:
    app: placetrack
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: placetrack-lb
  namespace: default
  labels:
    app: placetrack
spec:
  type: LoadBalancer
  selector:
    app: placetrack
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
