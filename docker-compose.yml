version: '3.8'

services:
  placetrack:
    build: .
    image: placetrack:latest
    container_name: placetrack-app
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: placetrack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    depends_on:
      - placetrack

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: placetrack-nginx-exporter
    ports:
      - "9113:9113"
    command:
      - "--nginx.scrape-uri=http://placetrack:80/stub_status"
    restart: unless-stopped
    depends_on:
      - placetrack
